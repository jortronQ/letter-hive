name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Generate and validate puzzle answers
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/build-puzzles.py --check
          python3 scripts/check-hints.py
          node --test tests/game.test.cjs

      - name: Prepare static site
        run: |
          mkdir -p "$RUNNER_TEMP/letter-hive-site/data/esdb"
          cp index.html letter-hive.css letter-hive.js favicon.svg manifest.webmanifest "$RUNNER_TEMP/letter-hive-site/"
          cp -r icons "$RUNNER_TEMP/letter-hive-site/"
          sed "s/LETTER_HIVE_BUILD_REVISION/${GITHUB_SHA}/" sw.js > "$RUNNER_TEMP/letter-hive-site/sw.js"
          cp data/puzzles.json data/daily-rotation.json data/hints.json "$RUNNER_TEMP/letter-hive-site/data/"
          cp data/esdb/COPYRIGHT.txt "$RUNNER_TEMP/letter-hive-site/data/esdb/"

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/letter-hive-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
